name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            if [ ! -d "/opt/quant_platform/.git" ]; then
              git clone https://Adriana-777:${{ secrets.GH_TOKEN }}@github.com/Adriana-777/quant-platform.git /opt/quant_platform
            fi

            cd /opt/quant_platform
            git remote set-url origin https://Adriana-777:${{ secrets.GH_TOKEN }}@github.com/Adriana-777/quant-platform.git
            git pull origin main

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            docker-compose -f infra/docker/docker-compose.yml pull
            docker-compose -f infra/docker/docker-compose.yml up -d --build
            docker image prune -f

            echo "✅ 部署完成 $(date)"
