global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'quant_platform'
    static_configs:
      - targets: ['204.168.157.134:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s
