services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: quant_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - quant_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quant_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - quant_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quant_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: quant
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - quant_net

  redis:
    image: redis:7.2-alpine
    container_name: quant_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - quant_net

  postgres:
    image: postgres:15-alpine
    container_name: quant_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant123
      POSTGRES_DB: quant_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant_net

  prometheus:
    image: prom/prometheus:latest
    container_name: quant_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - quant_net

  grafana:
    image: grafana/grafana:latest
    container_name: quant_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: quant123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - quant_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quant_node_exporter
    ports:
      - "9100:9100"
    networks:
      - quant_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  quant_net:
    driver: bridge