version: "3.9"

# 本地开发基础设施
# 启动命令：docker-compose -f infra/docker/docker-compose.yml up -d
# 停止命令：docker-compose -f infra/docker/docker-compose.yml down

services:

  # ── Kafka + Zookeeper ─────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: quant_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quant_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # 手动建 topic，防止拼写错误
      KAFKA_LOG_RETENTION_HOURS: 24

  # Kafka 管理 UI（可选，方便查看 topic 和消息）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quant_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ── Redis ─────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: quant_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  # ── PostgreSQL ────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: quant_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant123
      POSTGRES_DB: quant_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
